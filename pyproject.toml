[project]
name = "cogame-nmmo"
version = "0.1.0"
description = "Coworld game running PufferLib's Ocean NMMO3 with bit-exact obs/action/physics via a wasm-compiled vendored sim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "numpy>=2.4.6",
    "wasmtime>=47.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/cogame_nmmo", "players"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: long-running behavioral tests (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    # Pinned exactly: server code carries version-specific workarounds for
    # this certifier (the legacy /replay probe and the /global first-message
    # probe — see the coworld<=0.1.34 comments in server/cogame_nmmo/
    # server.py). Bump deliberately and re-run `coworld certify`.
    "coworld==0.1.34",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
