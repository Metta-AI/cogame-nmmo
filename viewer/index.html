<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cogame-nmmo replay</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #0b1414; color: #cfe;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center;
  }
  header { margin: 10px 0 4px; font-size: 14px; color: #6db; }
  #stage { position: relative; }
  canvas {
    display: block; background: #000; max-width: 100vw; height: auto;
    image-rendering: pixelated;
  }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 16px; color: #9cc;
    pointer-events: none; text-align: center; white-space: pre-line;
  }
  #controls {
    display: flex; gap: 10px; align-items: center; margin: 10px 0;
    flex-wrap: wrap; justify-content: center;
  }
  button, select {
    background: #12302c; color: #cfe; border: 1px solid #2a5;
    border-radius: 4px; font: inherit; padding: 4px 12px; cursor: pointer;
  }
  button:disabled, select:disabled { opacity: .4; cursor: default; }
  #seek { width: 380px; }
  #tickinfo { min-width: 130px; text-align: center; }
  #seats { margin: 6px 0 16px; font-size: 13px; }
  #seats h3 { margin: 0 0 4px; font-size: 13px; font-weight: bold; color: #4cf; }
  #seats ol { margin: 0; padding: 0 0 0 1.6em; }
  #seats li.followed { color: #fd5; }
  #endcard {
    margin: 4px 0 10px; font-size: 15px; color: #fd5; min-height: 1.2em;
  }
  #warn { margin: 2px 0 6px; font-size: 13px; color: #fa4; }
</style>
</head>
<body>
<header>cogame-nmmo replay viewer</header>
<div id="stage">
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">loading wasm ...</div>
</div>
<div id="controls">
  <button id="playpause" disabled>play</button>
  <select id="speed" disabled>
    <option value="1">1x</option>
    <option value="4">4x</option>
    <option value="16">16x</option>
    <option value="64">64x</option>
  </select>
  <input id="seek" type="range" min="0" max="0" value="0" step="1" disabled>
  <span id="tickinfo">- / -</span>
  <select id="follow" disabled></select>
</div>
<div id="endcard"></div>
<div id="warn"></div>
<div id="seats">
  <h3>Standings (mean score per life)</h3>
  <ol id="seat-list"></ol>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const statusEl = $("status");

let header = null;       // replay header JSON (JS-side parse)
let totalTicks = 0;
let numAgents = 0;
let seeking = false;

function setStatus(text) { statusEl.textContent = text; }

// Replay header parse: magic "NMMO" + version u8 + header_len u32le + JSON.
// (Binary layout authority: server/cogame_nmmo/replay.py.)
function parseHeader(buf) {
  if (buf.length < 9) throw new Error("replay too short");
  const magic = String.fromCharCode(...buf.slice(0, 4));
  if (magic !== "NMMO") throw new Error("bad magic: " + magic);
  if (buf[4] !== 1) throw new Error("unsupported version: " + buf[4]);
  const headerLen =
    new DataView(buf.buffer, buf.byteOffset + 5, 4).getUint32(0, true);
  return JSON.parse(new TextDecoder().decode(buf.slice(9, 9 + headerLen)));
}

// The replay body stride: seat i controls agents [i*h, (i+1)*h). A header
// that cannot state the topology is unusable — fail loudly, and with a
// specific message for the out-of-range case (the C viewer_load would
// only return a generic -1 at its VIEWER_MAX_AGENTS backstop).
const MAX_AGENTS = 1024;  // sim/viewer_main.c VIEWER_MAX_AGENTS
function agentTopology(cfg) {
  const h = cfg.heroes_per_seat;
  if (!Array.isArray(cfg.players) || cfg.players.length < 1 ||
      !Number.isInteger(h) || h < 1) {
    throw new Error("header config lacks players/heroes_per_seat topology");
  }
  const agents = cfg.players.length * h;
  if (agents > MAX_AGENTS) {
    throw new Error(
      `replay topology out of range: ${cfg.players.length} seats x ` +
      `${h} heroes = ${agents} agents (viewer cap ${MAX_AGENTS})`);
  }
  return { seats: cfg.players.length, heroesPerSeat: h, agents };
}

// Standings list: seats ranked by final score (header.result.scores —
// mean score per life, engine-derived; episodes have no winner).
// textContent only — names are player-controlled data. The list doubles
// as the endcard's data source and highlights the followed seat.
function fillSeats(cfg) {
  const scores = (header.result && header.result.scores) || [];
  const rows = cfg.players.map((p, seat) => ({
    seat, name: p.name,
    score: typeof scores[seat] === "number" ? scores[seat] : null,
  }));
  rows.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  const list = $("seat-list");
  list.textContent = "";
  for (const r of rows) {
    const li = document.createElement("li");
    li.dataset.seat = r.seat;
    li.textContent = r.score === null
      ? r.name : `${r.name} — ${r.score.toFixed(2)}`;
    list.appendChild(li);
  }
}

// Camera-follow selector: one entry per seat (the centered renderer
// tracks a single agent; seat i's first agent). textContent-only names.
function fillFollow(cfg, heroesPerSeat) {
  const sel = $("follow");
  sel.textContent = "";
  cfg.players.forEach((p, seat) => {
    const opt = document.createElement("option");
    opt.value = String(seat * heroesPerSeat);
    opt.textContent = `follow: ${p.name}`;
    sel.appendChild(opt);
  });
}

function highlightFollowed() {
  const pid = Module.ccall("viewer_get_follow", "number", [], []);
  for (const li of $("seat-list").children) {
    const h = header.config.heroes_per_seat || 1;
    li.classList.toggle(
      "followed", Number(li.dataset.seat) === Math.floor(pid / h));
  }
}

function endcardText() {
  const r = header.result || {};
  const scores = r.scores || [];
  const names = header.config.players.map(p => p.name);
  const best = scores.length
    ? names[scores.indexOf(Math.max(...scores))] : null;
  const who = best === null ? "final standings above"
    : `top seat: ${best}`;
  return r.end_reason ? `${who} (${r.end_reason})` : who;
}

function refreshUi() {
  const tick = Module.ccall("viewer_tick", "number", [], []);
  const playing = Module.ccall("viewer_playing", "number", [], []);
  $("tickinfo").textContent = `${tick} / ${totalTicks}`;
  if (!seeking) $("seek").value = tick;
  const ended = !playing && tick >= totalTicks && totalTicks > 0;
  $("playpause").textContent = playing ? "pause" : (ended ? "replay" : "play");
  $("endcard").textContent = ended ? endcardText() : "";
  requestAnimationFrame(refreshUi);
}

async function loadReplay() {
  const url = new URLSearchParams(location.search).get("replay")
    || "/replay-data";
  setStatus("fetching replay ...");
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`fetch ${url}: HTTP ${resp.status}`);
  const bytes = new Uint8Array(await resp.arrayBuffer());
  header = parseHeader(bytes);
  const topo = agentTopology(header.config);
  numAgents = topo.agents;
  fillSeats(header.config);
  fillFollow(header.config, topo.heroesPerSeat);

  // sim/build_viewer.sh embeds the sha of the sim wasm this viewer was
  // built alongside (sim_sha.js, optional). A replay recorded with a
  // different sim build may re-simulate divergently — warn on screen.
  const builtSha = window.SIM_WASM_SHA256;
  const replaySha = header.sim_wasm_sha256;
  if (builtSha && replaySha && replaySha !== "unknown" &&
      builtSha !== replaySha) {
    $("warn").textContent =
      "warning: replay was recorded with a different sim build (replay " +
      replaySha.slice(0, 12) + "… vs viewer " +
      builtSha.slice(0, 12) + "…); re-simulation may diverge";
  }

  // Copy into the wasm heap; the buffer stays alive for the page's
  // lifetime (viewer_load keeps a pointer to the action body).
  const ptr = Module._malloc(bytes.length);
  Module.HEAPU8.set(bytes, ptr);
  if (!Number.isInteger(header.config.seed)) {
    throw new Error(
      "header config.seed is not an integer: " + header.config.seed);
  }
  const seed = header.config.seed >>> 0;  // & 0xFFFFFFFF, like the host
  totalTicks = Module.ccall(
    "viewer_load", "number",
    ["number", "number", "number", "number"],
    [ptr, bytes.length, seed, numAgents]);
  if (totalTicks < 0) throw new Error("viewer_load rejected replay bytes");
  if (totalTicks !== header.tick_count) {
    throw new Error(
      `body has ${totalTicks} ticks, header says ${header.tick_count}`);
  }

  $("seek").max = totalTicks;
  for (const el of ["playpause", "speed", "seek", "follow"])
    $(el).disabled = false;
  setStatus("");
  highlightFollowed();
  Module.ccall("viewer_set_playing", null, ["number"], [1]);
  refreshUi();
}

$("playpause").addEventListener("click", () => {
  const playing = Module.ccall("viewer_playing", "number", [], []);
  if (playing) {
    Module.ccall("viewer_set_playing", null, ["number"], [0]);
    return;
  }
  const tick = Module.ccall("viewer_tick", "number", [], []);
  if (tick >= totalTicks) {  // ended: restart from tick 0
    Module.ccall("viewer_seek", null, ["number"], [0]);
  }
  Module.ccall("viewer_set_playing", null, ["number"], [1]);
});

$("speed").addEventListener("change", (e) => {
  Module.ccall("viewer_set_speed", null, ["number"], [Number(e.target.value)]);
});

$("follow").addEventListener("change", (e) => {
  Module.ccall("viewer_set_follow", null, ["number"], [Number(e.target.value)]);
  highlightFollowed();
});

// Seek re-simulates from tick 0 (deterministic but not free): preview the
// target while dragging, re-sim once on release. A drag that ends on the
// value it started at fires no `change`, so pointerup/keyup also clear
// the preview state; seekGen guards a stale scheduled seek from
// clobbering a newer drag.
let seekGen = 0;
let seekPending = false;  // a scheduled re-sim has not landed yet
$("seek").addEventListener("input", (e) => {
  seeking = true;
  $("tickinfo").textContent = `${e.target.value} / ${totalTicks}`;
});
// pointerup/keyup can fire AFTER `change` scheduled the re-sim; clearing
// the preview then would snap the slider back to the pre-seek tick for a
// frame. While a seek is pending, the pending seek owns the flag.
const endSeekPreview = () => { if (!seekPending) seeking = false; };
$("seek").addEventListener("pointerup", endSeekPreview);
$("seek").addEventListener("keyup", endSeekPreview);
$("seek").addEventListener("change", (e) => {
  const target = Number(e.target.value);
  const gen = ++seekGen;
  seeking = true;  // hold the preview until this seek lands
  seekPending = true;
  setStatus(`seeking to tick ${target} ...`);
  // let the status paint before the (blocking) re-sim
  setTimeout(() => {
    if (gen !== seekGen) return;  // superseded by a newer seek
    Module.ccall("viewer_seek", null, ["number"], [target]);
    setStatus("");
    seeking = false;
    seekPending = false;
  }, 20);
});

var Module = {
  canvas: $("canvas"),
  onRuntimeInitialized: () => {
    loadReplay().catch((e) => setStatus("failed:\n" + e.message));
  },
  printErr: (t) => console.error(t),
  // Runtime death must be visible on the page, not only in the console
  // (e.g. an OOM abort mid-seek would otherwise just freeze the canvas).
  onAbort: (what) => setStatus("viewer wasm aborted:\n" + what),
  onExit: (code) => { if (code !== 0) setStatus("viewer wasm exited: " + code); },
};
</script>
<script src="sim_sha.js"></script>
<script src="nmmo3_viewer.js"></script>
</body>
</html>
